name: pnLibrary
version: '${version}'
main: ru.privatenull.pnlibrary.bukkit.PnLibraryBukkitPlugin
author: pnFolder
description: Shared runtime and diagnostics for pnFolder plugins
load: STARTUP
folia-supported: true
softdepend: [PlaceholderAPI, Vault, PlayerPoints]
commands:
  pn:
    description: Управление плагинами pnFolder
    usage: /pn [status|updates|check|update|restart|debug|support|error|error-repeat|error-chain]
    permission: pnlibrary.admin
  pndebug:
    description: Creates an encrypted pnLibrary diagnostic report
    usage: /pndebug [all|plugin] [--full|--config|--logs] [--local]
    aliases: [pnlib]
    permission: pnlibrary.debug
  pncurrency:
    description: Manages currencies registered in pnLibrary
    usage: /pncurrency <list|currency|confirm|cancel> [balance|add|take|set|reset|pay|history|code]
    aliases: [pncurrencies]
permissions:
  pnlibrary.admin:
    description: Управление pnLibrary и обновлениями pnFolder
    default: op
  pnlibrary.debug:
    description: Allows creating encrypted pnLibrary diagnostic reports
    default: op
