name: Publish existing version to Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.2.3
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_POM_LICENSE_NAME: ${{ vars.MAVEN_LICENSE_NAME }}
      ORG_GRADLE_PROJECT_POM_LICENSE_URL: ${{ vars.MAVEN_LICENSE_URL }}
      ORG_GRADLE_PROJECT_POM_LICENSE_DIST: repo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release identity and publication configuration
        shell: pwsh
        run: |
          $version = (Select-String -Path gradle.properties -Pattern '^version=(.+)$').Matches[0].Groups[1].Value.Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match the checked-out project version' }
          ./tools/release/publish-central.ps1 -ValidateOnly
      - name: Verify the release before publication
        run: ./gradlew check apiCheck --console=plain
      - uses: ./.github/actions/publish-central
