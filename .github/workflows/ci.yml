name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Enforce pnLibrary API generation policy
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          $base = if ($env:PR_BASE_SHA) { $env:PR_BASE_SHA } else { $env:PUSH_BASE_SHA }
          if (-not $base -or $base -match '^0+$') {
            Write-Host 'No comparable base commit; accepting the initial API baseline.'
            exit 0
          }
          git cat-file -e "${base}:modules/api/api/api.api" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git cat-file -e "${base}:pnlibrary-api/api/pnlibrary-api.api" 2>$null
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'The base commit predates API guardrails; accepting the initial API baseline.'
            exit 0
          }
          tools/api/check-api-generation.ps1 -BaseRef $base
      - name: Test and build distributions
        run: ./gradlew clean check apiCheck :distribution:build --warning-mode all
      - name: Verify API and release tooling
        shell: pwsh
        run: |
          ./tools/api/check-api-generation.tests.ps1
          ./tools/release/check-release-tools.tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: pnLibrary-distributions
          path: distribution/build/libs/*.jar
          if-no-files-found: error

  java-compatibility:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17', '21']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pnLibrary-distributions
          path: distributions
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Run packaged updater on the supported JVM
        shell: bash
        run: |
          jars=(distributions/pnLibrary-updater-*.jar)
          test "${#jars[@]}" -eq 1
          mkdir -p fixture/plugins/pnLibrary
          java -jar "${jars[0]}" --server-stopped "$PWD/fixture/plugins/pnLibrary"
