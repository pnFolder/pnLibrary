name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full release or publish the existing version only
        required: true
        type: choice
        options: [full, central]
        default: full
      version:
        description: Semantic version, for example 2.0.0-beta.7
        required: true
        type: string
      release_notes:
        description: Short release description
        required: true
        type: string
      publish_central:
        description: Publish configured Maven artifacts to Maven Central
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_POM_LICENSE_NAME: ${{ vars.MAVEN_LICENSE_NAME }}
      ORG_GRADLE_PROJECT_POM_LICENSE_URL: ${{ vars.MAVEN_LICENSE_URL }}
      ORG_GRADLE_PROJECT_POM_LICENSE_DIST: repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate requested version
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Invalid semantic version: $env:RELEASE_VERSION"
          }
          if ($env:RELEASE_MODE -eq 'central') {
            $current = (Select-String -Path gradle.properties -Pattern '^version=(.+)$').Matches[0].Groups[1].Value
            if ($current -ne $env:RELEASE_VERSION) {
              throw "Requested $env:RELEASE_VERSION, but the repository contains $current"
            }
            $tag = git rev-parse "refs/tags/v$env:RELEASE_VERSION^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tag -ne (git rev-parse HEAD)) {
              throw 'Central-only mode must run on the exact release tag; use the existing-version publication workflow'
            }
          }

      - name: Verify Maven Central support
        if: inputs.publish_central
        shell: pwsh
        run: |
          $tasks = .\gradlew.bat tasks --all --console=plain | Out-String
          if ($tasks -notmatch 'publishAndReleaseToMavenCentral') {
            throw 'Maven Central publishing is not configured in Gradle'
          }
          ./tools/release/publish-central.ps1 -ValidateOnly

      - name: Set project version
        if: inputs.mode == 'full'
        shell: pwsh
        run: tools/release/release.ps1 -Action version -Version $env:RELEASE_VERSION

      - name: Build and verify
        run: .\gradlew.bat clean check :distribution:build --console=plain

      - name: Verify release tooling
        shell: pwsh
        run: ./tools/release/check-release-tools.tests.ps1

      - name: Generate catalog and changelog from packaged metadata
        if: inputs.mode == 'full'
        shell: pwsh
        run: tools/release/update-catalog.ps1 -ManifestPath distribution/build/libs/release-manifest.json -Notes $env:RELEASE_NOTES

      - name: Commit version and create tag
        if: inputs.mode == 'full'
        shell: pwsh
        run: |
          git config user.name 'pnFolder Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add gradle.properties .pnlibrary/releases.json ".pnlibrary/changelogs/$env:RELEASE_VERSION.md"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "release: $env:RELEASE_VERSION"
            if ($LASTEXITCODE -ne 0) { throw 'Release commit failed' }
          }
          git tag -a "v$env:RELEASE_VERSION" -m "pnLibrary $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag creation failed' }
          git push origin HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Release commit push failed' }
          git push origin "v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag push failed' }

      - name: Create GitHub Release
        if: inputs.mode == 'full'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifest = Get-Content -LiteralPath 'distribution/build/libs/release-manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:RELEASE_VERSION) { throw 'Release manifest version mismatch' }
          $artifacts = @($manifest.assets | ForEach-Object {
            if ([IO.Path]::GetFileName($_) -ne $_) { throw 'Invalid release asset filename' }
            (Get-Item -LiteralPath (Join-Path 'distribution/build/libs' $_)).FullName
          })
          if (-not $artifacts) { throw 'No release JARs were built' }
          if (-not (Test-Path -LiteralPath "distribution/build/libs/pnLibrary-updater-$env:RELEASE_VERSION.jar")) {
            throw 'The standalone restart updater must be included in the release'
          }
          if (-not (Test-Path -LiteralPath "distribution/build/libs/pnLibrary-policy-kotlin-$env:RELEASE_VERSION.jar")) {
            throw 'The optional Kotlin policy compiler must be included in the release'
          }
          $arguments = @('release', 'create', "v$env:RELEASE_VERSION") + $artifacts + @(
            '--title', "pnLibrary $env:RELEASE_VERSION",
            '--notes', $env:RELEASE_NOTES
          )
          if ($env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }

      - name: Publish configured artifacts to Maven Central
        if: inputs.publish_central
        uses: ./.github/actions/publish-central
