# Product identity: the only place to change the name, id, author or version.
# Used by plugin.yml, bungee.yml, the Velocity annotation and the generated PnLibraryIdentity class.
version=0.0.1-dev.2
pnlibrary.product-id=pnlibrary
pnlibrary.name=pnLibrary
# Comma-separated list; platforms without a list get them joined.
pnlibrary.authors=privatenull, inventorytype
pnlibrary.organization=pnFolder
pnlibrary.description=Shared runtime and diagnostics for pnFolder plugins
pnlibrary.repository=pnFolder/pnLibrary
pnlibrary.support-url=https://discord.gg/TFdnyvMft
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
