plugins {
    id 'java-library'
}

group = 'ru.privatenull'
version = '1.0.0'

repositories {
    mavenCentral()

    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }

    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }

    maven {
        name = 'rosewood'
        url = 'https://repo.rosewooddev.io/repository/public/'
    }

    maven {
        name = 'bungeecord'
        url = 'https://repo.md-5.net/content/repositories/snapshots/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.115-stable'
    compileOnly 'net.md-5:bungeecord-api:1.21-R0.4'
    compileOnly 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'

    compileOnly 'com.mojang:authlib:1.5.25'
    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'

    compileOnly platform('net.kyori:adventure-bom:5.2.0')
    compileOnly 'net.kyori:adventure-api'
    compileOnly 'net.kyori:adventure-text-minimessage'
    compileOnly 'net.kyori:adventure-text-serializer-legacy'

    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'org.black_ixx:playerpoints:3.3.5'

    api 'org.mongodb:mongodb-driver-sync:5.2.1'

    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
    implementation 'com.mysql:mysql-connector-j:9.1.0'
    implementation 'redis.clients:jedis:7.5.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.115-stable'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
