name: '${name}'
version: '${version}'
main: org.pnfolder.pnlibrary.bukkit.PnLibraryBukkitPlugin
authors: ${authors}
description: '${description}'
website: '${website}'
load: STARTUP
api-version: '1.13'
folia-supported: true
softdepend: [PlaceholderAPI, Vault, PlayerPoints]
permissions:
  pnlibrary.admin:
    description: Управление pnLibrary и обновлениями pnFolder
    default: op
  pnlibrary.debug:
    description: Создавать зашифрованные отчёты для поддержки (/pn debug)
    default: op
  pnlibrary.updates.notify:
    description: Получать уведомления об обновлениях при входе
    default: op
  pnlibrary.events.view:
    description: Смотреть журнал событий (/pn events) и получать сводку ошибок при входе
    default: op
  pnlibrary.events.bus:
    description: 'Смотреть события плагинов (/pn bus): слушатели, вызовы, трассировка'
    default: op
  pnlibrary.tasks:
    description: 'Смотреть задачи плагинов (/pn tasks) и отменять их'
    default: op
  pnlibrary.updates.view:
    description: Просматривать совместимый план обновлений
    default: op
  pnlibrary.updates.settings:
    description: Менять канал, автозагрузку и паузу обновлений плагина
    default: op
  pnlibrary.updates.rollback:
    description: Просматривать резервные наборы и откатывать обновления
    default: op
  pnlibrary.updates.download:
    description: Загружать и проверять совместимый план обновлений
    default: op
  pnlibrary.updates.install:
    description: Разрешать установку новых управляемых компонентов
    default: op
  pnlibrary.updates.restart:
    description: Подтверждать перезапуск после подготовки обновления
    default: op
